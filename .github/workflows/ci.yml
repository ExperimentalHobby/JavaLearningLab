name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'JavaLearningLab.code-workspace'
      - '.gitignore'
      - '.gitattributes'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'JavaLearningLab.code-workspace'
      - '.gitignore'
      - '.gitattributes'
  workflow_dispatch:

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  discover:
    name: Discover Maven projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Find folders containing pom.xml
        id: set-matrix
        run: |
          dirs=$(find . -mindepth 2 -maxdepth 2 -name pom.xml -printf '%h\n' | sed 's#^\./##' | sort)
          json=$(printf '%s\n' "$dirs" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  build:
    name: Build & test (${{ matrix.project }})
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up JDK 25
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: mvn test
        working-directory: ${{ matrix.project }}
        run: mvn -B test

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . -v
