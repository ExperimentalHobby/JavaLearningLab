name: CI

on:
  push:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'JavaLearningLab.code-workspace'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
  pull_request:
    branches: [master]
    paths-ignore:
      - '**.md'
      - '.claude/**'
      - 'LICENSE'
      - 'JavaLearningLab.code-workspace'
      - '.gitignore'
      - '.gitattributes'
      - 'docs/**'
  workflow_dispatch:

env:
  GITLEAKS_VERSION: "8.30.1"

jobs:
  discover:
    name: Discover Maven projects
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set-matrix.outputs.matrix }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5
        with:
          fetch-depth: 0

      - name: Find folders containing pom.xml changed in this run
        id: set-matrix
        run: |
          all_dirs=$(find . -mindepth 2 -maxdepth 2 -name pom.xml -printf '%h\n' | sed 's#^\./##' | sort)

          if [ "${{ github.event_name }}" = "pull_request" ]; then
            base="${{ github.event.pull_request.base.sha }}"
            head="${{ github.event.pull_request.head.sha }}"
          elif [ "${{ github.event_name }}" = "push" ]; then
            base="${{ github.event.before }}"
            head="${{ github.sha }}"
          else
            base=""
          fi

          # workflow_dispatch、または比較元コミットが取得できない場合(新規ブランチの初回pushなど)は
          # 差分を判定できないため、安全側に倒して全フォルダを対象にする。
          if [ -n "$base" ] && git cat-file -e "$base" 2>/dev/null; then
            changed_files=$(git diff --name-only "$base" "$head")

            # CIワークフロー自体の変更はロジック検証のため全フォルダを対象にする。
            if printf '%s\n' "$changed_files" | grep -q '^\.github/workflows/'; then
              dirs="$all_dirs"
            else
              dirs=$(printf '%s\n' "$all_dirs" | while IFS= read -r d; do
                [ -n "$d" ] || continue
                if printf '%s\n' "$changed_files" | grep -q "^$d/"; then
                  echo "$d"
                fi
              done)
            fi
          else
            dirs="$all_dirs"
          fi

          json=$(printf '%s\n' "$dirs" | jq -R -s -c 'split("\n") | map(select(length > 0))')
          echo "matrix=$json" >> "$GITHUB_OUTPUT"

  build:
    name: Build & test (${{ matrix.project }})
    needs: discover
    if: needs.discover.outputs.matrix != '[]'
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        project: ${{ fromJson(needs.discover.outputs.matrix) }}

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set up JDK 25
        uses: actions/setup-java@v5
        with:
          distribution: temurin
          java-version: '25'
          cache: maven

      - name: mvn test
        working-directory: ${{ matrix.project }}
        run: mvn -B test

  gitleaks:
    name: Gitleaks
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Gitleaks
        run: |
          curl -sSfL -o gitleaks.tar.gz https://github.com/gitleaks/gitleaks/releases/download/v${{ env.GITLEAKS_VERSION }}/gitleaks_${{ env.GITLEAKS_VERSION }}_linux_x64.tar.gz
          tar -xzf gitleaks.tar.gz gitleaks
          ./gitleaks detect --source . -v
