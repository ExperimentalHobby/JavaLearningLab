# JWT署名鍵(Base64エンコードされたHS256用の鍵、32バイト以上)。
# 環境変数JWT_SECRETで上書きできる。デフォルト値はデモ用であり、本番相当の運用では必ず上書きすること。
app.jwt.secret=${JWT_SECRET:ZGVtby1zZWNyZXQta2V5LWZvci1qd3Qtc2lnbmluZy1kby1ub3QtdXNlLWluLXByb2Q=}
app.jwt.validity-minutes=${JWT_VALIDITY_MINUTES:60}

# デモ用ユーザーの資格情報。環境変数で上書きできる。
app.demo-user.username=${DEMO_USER_USERNAME:alice}
app.demo-user.password=${DEMO_USER_PASSWORD:password}
